<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RELVA BI — Chart Playground</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #f5fbfc;
        font-family: -apple-system, 'Segoe UI', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
        color: #14233a;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p.lead {
        font-size: 13px;
        color: #5a6b7a;
        margin: 0 0 24px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
        gap: 20px;
      }
      .panel {
        background: #fff;
        border: 1px solid #c3e0e6;
        border-radius: 14px;
        padding: 16px;
      }
      .panel h2 {
        font-size: 13px;
        font-weight: 800;
        margin: 0 0 4px;
      }
      .panel .interpretation {
        font-size: 12px;
        color: #5a6b7a;
        margin: 0 0 12px;
      }
      .chart {
        width: 100%;
        height: 280px;
      }
    </style>
  </head>
  <body>
    <h1>RELVA BI — チャートプレイグラウンド</h1>
    <p class="lead">
      hardcoded な BiResult フィクスチャで各テンプレート(T1/T2/T4/T5/T8)を描画。kintone不要、HMRあり。
      見た目の調整はここで完結させ、build:customize → deploy:customize の往復はしない。
    </p>
    <div class="grid" id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
